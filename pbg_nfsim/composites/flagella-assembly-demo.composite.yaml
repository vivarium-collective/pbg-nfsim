name: flagella-assembly-demo
description: "NFSim flagella-assembly demo: MonomerProduction feeds free monomers into a shared species store, NFSim runs network-free complexation rules each interval, RAMEmitter records the species map and global time."

requires:
  processes: [NFSimProcess, MonomerProduction, RAMEmitter]

parameters:
  n_steps:
    type: int
    default: 10
    description: "NFSim n_steps per complexation interval."
  complexation_interval:
    type: float
    default: 50.0
    description: "Time interval (seconds) between NFSim updates."
  production_interval:
    type: float
    default: 1.0
    description: "Time interval (seconds) between MonomerProduction updates."

state:
  production:
    _type: process
    address: "local:MonomerProduction"
    config:
      production_rates:
        Free_fliG: 1.3
        Free_fliM: 1.7
        Free_fliN: 0.05
        Free_flhA: 0.05
        Free_flhB: 0.05
    outputs:
      monomers: ["species"]
    interval: "${production_interval}"
  complexation:
    _type: process
    address: "local:NFSimProcess"
    config:
      model_file: "<<flagella-model-path>>"
      n_steps: "${n_steps}"
    inputs:
      observables: ["species"]
    outputs:
      observables: ["species"]
    interval: "${complexation_interval}"
  species: {}
  emitter:
    _type: step
    address: "local:RAMEmitter"
    config:
      emit:
        species: "map[float]"
        time: "float"
    inputs:
      species: ["species"]
      time: ["global_time"]
